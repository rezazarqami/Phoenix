name: Verify Phoenix

on:
  pull_request:
    branches: [master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build and run regression checks
        run: dotnet run --project Phoenix.Test/Phoenix.Test.csproj --configuration Release
