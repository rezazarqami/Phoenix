<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ورود به فونیکس</title><style>*{box-sizing:border-box}body{margin:0;background:#080706;color:#f6ecd1;font:16px sans-serif;min-height:100vh;display:grid;place-items:center;padding:24px}main{width:min(100%,380px)}header{text-align:center;margin-bottom:30px}img{width:116px;height:116px;object-fit:cover;border-radius:24px}h1{letter-spacing:5px;color:#ddb96a;font-size:27px}h2{font-size:21px}p{color:#b5ac99;line-height:1.8}label{display:block;margin-top:20px}input,button{width:100%;padding:15px;border-radius:12px;font:inherit}input{margin-top:8px;background:#181510;border:1px solid #55452a;color:#fff;direction:ltr}button{margin-top:24px;background:#d7b260;color:#171108;border:0;font-weight:bold}button:disabled{opacity:.5}#loginMessage{color:#ffb6a6}</style></head><body><main><header><img src="/__phoenix_app/logo.png" alt="نشان فونیکس"><h1>PHOENIX</h1><p>تحلیل و مدیریت سیگنال‌ها</p></header><form id="loginForm"><h2>ورود به فونیکس</h2><label for="username">نام کاربری</label><input id="username" name="username" autocomplete="username" required><label for="password">رمز عبور</label><input id="password" name="password" type="password" autocomplete="current-password" required><button type="submit">ورود به فونیکس</button><p id="loginMessage" role="alert"></p></form></main><script>document.querySelector('#loginForm').addEventListener('submit',async e=>{e.preventDefault();const b=e.target.querySelector('button'),m=document.querySelector('#loginMessage');b.disabled=true;m.textContent='';try{const r=await fetch('/api/auth/login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(e.target)))});const d=await r.json();if(!r.ok)throw Error(d.error||'ورود ناموفق بود');document.querySelector('#password').value='';location.replace('/phoenix')}catch(err){m.textContent=err.message;b.disabled=false}});</script></body></html>
