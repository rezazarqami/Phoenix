name: Verify Phoenix exclusive owner access
on:
  push:
    branches: [ops/verify-owner-access]
    paths: ['.github/workflows/verify-owner-access.yml']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify service and non-secret owner-access status
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: 91.216.104.210
          username: phoenix-deploy
          key: ${{ secrets.PHOENIX_DEPLOY_SSH_KEY }}
          command_timeout: 2m
          script: |
            set -eu
            systemctl is-active --quiet phoenix.service
            python3 - <<'PY'
            import json, datetime
            from pathlib import Path
            import glob, subprocess, re
            print(subprocess.check_output(['systemctl','show','phoenix.service','--property=ExecMainStartTimestamp','--property=WorkingDirectory'],text=True).strip())
            command=subprocess.check_output(['systemctl','show','phoenix.service','--property=ExecStart'],text=True)
            print('application_paths='+json.dumps(re.findall(r'/[A-Za-z0-9_./-]+\.(?:dll|csproj)',command)))
            candidates=[]
            for base in ['/var/lib/phoenix','/opt/Phoenix']:
                candidates.extend(glob.glob(base+'/**/*.owner-only.json',recursive=True))
            print('status_files_found='+str(len(candidates)))
            assert len(candidates)==1, 'Expected one operational report'
            status=json.loads(Path(candidates[0]).read_text())
            assert status['enabled'] is True
            assert status['owner'].casefold()=='rezazarqami'
            assert status['additionalUsers']==0
            checked=datetime.datetime.fromisoformat(status['checkedAtUtc'].replace('Z','+00:00'))
            assert (datetime.datetime.now(datetime.timezone.utc)-checked).total_seconds()<600
            print(json.dumps({'service':'active','owner':status['owner'],'additionalUsers':status['additionalUsers'],'removedOnStartup':status['removedOnStartup'],'ownerOnly':True}))
            PY
