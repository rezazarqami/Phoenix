plugins { id 'com.android.application' }

android {
    namespace 'ir.marketsignalist.phoenix'
    compileSdk 35
    defaultConfig {
        applicationId 'ir.marketsignalist.phoenix'
        minSdk 26
        targetSdk 35
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        versionCode 10
        versionName '1.9-screenshots'
        // Public Firebase app identifiers only. Never place a service account here.
        ['APP_ID','API_KEY','PROJECT_ID','SENDER_ID'].each { key ->
            def value = System.getenv('PHOENIX_FIREBASE_' + key) ?: ''
            if (!(value ==~ /[A-Za-z0-9:_\-.]*/)) throw new GradleException('Invalid Firebase identifier')
            buildConfigField 'String', 'FIREBASE_' + key, '"' + value + '"'
        }
    }
    // Keep the test signing key at the exact location persisted by CI.
    signingConfigs { debug { storeFile file(System.getProperty('user.home') + '/.android/debug.keystore') } }
    flavorDimensions 'client'
    productFlavors {
        orbit {
            dimension 'client'
            applicationIdSuffix '.orbit'
            manifestPlaceholders = [clientLabel: 'مدار و فونیکس']
            buildConfigField 'boolean', 'PHOENIX_ONLY', 'false'
        }
        phoenix {
            dimension 'client'
            applicationIdSuffix '.standalone'
            manifestPlaceholders = [clientLabel: 'Phoenix']
            buildConfigField 'boolean', 'PHOENIX_ONLY', 'true'
        }
    }
    buildTypes { debug { versionNameSuffix '-test' } }
    buildFeatures { buildConfig true }
    testOptions { unitTests.includeAndroidResources = true }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies {
    androidTestImplementation 'androidx.test:runner:1.6.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test:core:1.6.1'
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.robolectric:robolectric:4.14.1'
    implementation 'androidx.work:work-runtime:2.10.0'
    implementation 'androidx.webkit:webkit:1.12.1'
    implementation platform('com.google.firebase:firebase-bom:33.7.0')
    implementation 'com.google.firebase:firebase-messaging'
}
