name: Diagnose Phoenix Queue Data
on:
  push:
    branches: [codex/diagnose-queue-data]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect recovery metadata without exposing signal records
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: 91.216.104.210
          username: phoenix-deploy
          key: ${{ secrets.PHOENIX_DEPLOY_SSH_KEY }}
          command_timeout: 1m
          script: |
            python3 - <<'PY'
            import pathlib,json
            root=pathlib.Path('/opt/Phoenix/Phoenix.Web/bin/Debug/net10.0')
            for name in ['data-real','data-strategy2']:
                directory=root/name
                path=directory/'server-signals.json'
                raw=path.read_bytes()
                try:
                    rows=json.loads(raw)
                    print(name,'VALID_JSON','ROWS',len(rows),'ACTIVE',sum(r.get('status') in ['Pending','Submitting','Submitted','Filled','Closing'] for r in rows),'CORRUPT_BACKUPS',len(list(directory.glob('server-signals.json.corrupt-*'))))
                except (ValueError,UnicodeError): print(name,'INVALID_JSON','NUL_BYTES',raw.count(bytes([0])))
            PY
