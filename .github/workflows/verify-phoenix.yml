name: Verify Phoenix

on:
  push:
    branches: ["personal/**"]
  pull_request:
    branches: [master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build and run complete Phoenix regression suite
        run: dotnet run --project Phoenix.Test/Phoenix.Test.csproj --configuration Release
      - name: Verify Phoenix-only routes and authentication
        run: python3 Phoenix.Test/phoenix-only-access-tests.py
      - name: Verify owner-only account removal and session revocation
        run: python3 Phoenix.Test/owner-only-access-tests.py
      - name: Verify conditional history and static asset caching
        run: python3 Phoenix.Test/cache-http-tests.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Verify Phoenix interface
        run: |
          npm ci --prefix Phoenix.Test/ui --ignore-scripts --no-audit --no-fund
          npm test --prefix Phoenix.Test/ui 2>&1 | tee phoenix-ui-tests.log
      - name: Verify chart delivery and concurrent review decisions
        run: |
          node Phoenix.Test/review-images-tests.cjs
          node Phoenix.Test/review-delivery-browser-tests.cjs
          node Phoenix.Test/in-app-review-ui-tests.cjs
      - name: Verify login and whole-application startup
        run: |
          node Phoenix.Test/startup-request-tests.cjs
          node Phoenix.Test/startup-browser-tests.cjs
          node Phoenix.Test/home-polling-ui-tests.cjs
          node Phoenix.Test/connection-status-ui-tests.cjs
          node Phoenix.Test/live-positions-ui-tests.cjs
          node Phoenix.Test/live-chart-scale-tests.cjs
      - name: Preserve interface failure details
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: phoenix-ui-test-log
          path: phoenix-ui-tests.log
          if-no-files-found: ignore
          retention-days: 3
      - name: Verify Android-compatible cancellation controls
        run: node Phoenix.Test/cancellation-ui-tests.cjs
      - name: Verify batch controls under delayed responses
        run: node Phoenix.Test/batch-controls-tests.cjs
      - name: Verify complete Crypto Markets page initialization
        run: node Phoenix.Test/crypto-market-ui-tests.cjs
