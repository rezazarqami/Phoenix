<!DOCTYPE html>

<html dir="rtl" lang="fa"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1,viewport-fit=cover" name="viewport"/><meta content="#edf7ff" name="theme-color"/><link href="/manifest.webmanifest" rel="manifest"/><link href="/icons/phoenix-192.png" rel="icon"/><style>@font-face{font-family:PhoenixVazir;src:url('/fonts/Vazirmatn-variable.woff2') format('woff2');font-display:swap}
:root{color-scheme:light;font-family:PhoenixVazir,Tahoma,sans-serif;color:#163858;background:#edf7ff}*{box-sizing:border-box}body{margin:0;min-height:100dvh;background:linear-gradient(180deg,#eef9ff00 30%,#f4faff 86%),url('/analysis-assets/phoenix-ice-sky.webp') 67% top/auto 70vh no-repeat,#f4faff;padding:36px 20px;display:grid;place-items:center}button,input{font:inherit}.login-shell{width:min(1040px,100%);display:grid;grid-template-columns:1fr 1fr;gap:60px;align-items:center;direction:ltr}.welcome{align-self:stretch;display:flex;flex-direction:column;justify-content:space-between;padding:20px 0 40px;direction:rtl}.brand{display:flex;align-items:center;gap:16px;direction:ltr;text-decoration:none;color:#102b45}.brand img{width:105px;height:105px;border-radius:50%;object-fit:contain}.brand>span{font:800 34px Arial;letter-spacing:.13em}.brand small{display:block;margin-top:10px;font:700 9px Arial;letter-spacing:.17em}.welcome-copy{margin-top:180px;text-shadow:0 1px 10px #fff}.welcome-copy h1{font-size:34px;line-height:1.7;margin:0;color:#14385b}.welcome-copy p{font-size:15px;color:#55758f}.login-panel{direction:rtl;padding:36px;border:1px solid #fff;border-radius:30px;background:linear-gradient(130deg,#ffffffed,#f6fbffeb);box-shadow:0 20px 70px #3d87b91a;backdrop-filter:blur(16px)}.eyebrow{display:block;text-align:left;font:700 11px Arial;letter-spacing:.25em;color:#289fd3;margin-bottom:22px}.login-panel h2{font-size:28px;color:#133a5e;margin:0 0 10px}.login-panel form>p{font-size:13px;line-height:1.9;color:#7892a8;margin:0 0 25px}.login-panel label{display:block;font-size:13px;font-weight:600;color:#416680;margin:18px 0 9px}.login-panel input{width:100%;height:53px;padding:12px 15px;background:#f9fcff;border:1px solid #dce9f2;border-radius:13px;color:#173c59;outline:none}.login-panel input:focus{border-color:#269fe8;box-shadow:0 0 0 4px #149af410}.input-wrap{position:relative}.input-wrap input{padding-right:73px}.input-wrap button{position:absolute;right:7px;top:8px;min-height:37px;padding:6px 10px;border:0;border-radius:8px;color:#268fc8;background:#eaf7ff;font-size:11px;cursor:pointer}.submit{width:100%;min-height:54px;border:0;border-radius:14px;margin-top:25px;background:linear-gradient(110deg,#38bfe9,#087ff6);color:#fff;font-size:17px;font-weight:700;box-shadow:0 8px 22px #0e98ed21;cursor:pointer}.submit:disabled{opacity:.6;cursor:wait}.login-panel form #loginMessage{color:#c63a56;margin:14px 0 0;font-size:12px}.login-panel #loginMessage:empty{display:none}.secure-note{border-top:1px solid #e3edf4;padding-top:18px;margin-top:22px;font-size:11px;line-height:1.8;color:#94a9b8}button:focus-visible,a:focus-visible{outline:3px solid #159de8;outline-offset:3px}@media(max-width:700px){body{padding:25px 18px 35px;display:block;background-size:auto 420px;background-position:70% top}.login-shell{display:block;max-width:450px;margin:auto}.welcome{padding:10px 0 0;min-height:250px;justify-content:flex-start}.brand{gap:12px}.brand img{width:83px;height:83px}.brand>span{font-size:29px}.brand small{font-size:8px;margin-top:8px}.welcome-copy{margin-top:28px;text-align:right}.welcome-copy h1{font-size:21px;line-height:1.6}.welcome-copy h1 br{display:none}.welcome-copy p{font-size:11px;margin-top:6px}.login-panel{padding:27px 24px;border-radius:27px}.login-panel h2{font-size:25px}.eyebrow{font-size:9px;margin-bottom:18px}.login-panel form>p{font-size:12px;margin-bottom:22px}}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto}}
</style><title>ورود به فونیکس</title></head><body>
<main class="login-shell"><section class="welcome"><a class="brand" href="/phoenix"><img alt="فونیکس" src="/__phoenix_app/logo.png"/><span>PHOENIX<small>BYBIT FUTURES CONTROL</small></span></a><div class="welcome-copy"><h1>تحلیل، استراتژی،<br/>اجرای هوشمند.</h1><p>پنل مستقل مدیریت سیگنال و معاملات فونیکس</p></div></section>
<section class="login-panel"><form id="loginForm"><span class="eyebrow">PHOENIX · SIGN IN</span><h2>ورود به فونیکس</h2><p>با نام کاربری و رمز عبور فعلی فونیکس وارد شو.</p><label for="username">نام کاربری</label><input autocomplete="username" dir="ltr" id="username" maxlength="200" name="username" required=""/><label for="password">رمز عبور</label><div class="input-wrap"><input autocomplete="current-password" dir="ltr" id="password" maxlength="1000" name="password" required="" type="password"/><button aria-label="نمایش رمز عبور" aria-pressed="false" id="togglePassword" type="button">نمایش</button></div><button class="submit" type="submit">ورود به فونیکس</button><p aria-live="polite" id="loginMessage" role="alert"></p><div class="secure-note">با نام کاربری و رمز عبور حساب فونیکس وارد شوید.</div></form></section></main><script>(() => {
  'use strict';
  const form=document.querySelector('#loginForm'),message=document.querySelector('#loginMessage'),password=document.querySelector('#password'),toggle=document.querySelector('#togglePassword');
  toggle.addEventListener('click',()=>{const visible=password.type==='password';password.type=visible?'text':'password';toggle.textContent=visible?'پنهان':'نمایش';toggle.setAttribute('aria-pressed',String(visible));toggle.setAttribute('aria-label',visible?'پنهان‌کردن رمز عبور':'نمایش رمز عبور');});
  form.addEventListener('submit',async event=>{
    event.preventDefault();message.textContent='';const button=form.querySelector('.submit');button.disabled=true;
    try {
      const values=Object.fromEntries(new FormData(form));
      const response=await fetch('/api/auth/login',{method:'POST',credentials:'same-origin',headers:{'Content-Type':'application/json'},body:JSON.stringify(values)});
      const data=await response.json();if(!response.ok)throw new Error(response.status===429?'تلاش‌های ورود زیاد شده؛ یک دقیقه بعد دوباره امتحان کن.':data.error||'ورود ناموفق بود.');
      password.value='';
      const next=new URLSearchParams(location.search).get('next');let destination='/phoenix';
      if(next){try{const target=new URL(next,location.origin);if(target.origin===location.origin&&target.pathname==='/notifications')destination=target.pathname+target.search;}catch{}}
      location.replace(destination);
    }catch(error){message.textContent=error.message;button.disabled=false;}
  });
})();
</script></body></html>
