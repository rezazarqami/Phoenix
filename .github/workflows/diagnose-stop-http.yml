name: Diagnose Phoenix stop HTTP routing
on:
  push:
    branches: [codex/diagnose-stop-http-routing]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Compare application, nginx and public stop routing
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: 91.216.104.210
          username: phoenix-deploy
          key: ${{ secrets.PHOENIX_DEPLOY_SSH_KEY }}
          command_timeout: 90s
          script: |
            systemctl show phoenix.service --property=ExecStart,WorkingDirectory,User,EnvironmentFiles
            ps -C dotnet -o pid=,args=
            ls -l /opt/Phoenix/Phoenix.Web/bin/Debug/net10.0/Phoenix.Web.dll /opt/Phoenix/Phoenix.Web/bin/Release/net10.0/Phoenix.Web.dll
            cat /etc/nginx/snippets/torsepan-relay.conf
            