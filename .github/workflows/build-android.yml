name: Build Phoenix Android

on:
  push:
    paths: ["android/**", "Phoenix.Web/wwwroot/personal*", "Phoenix.Web/wwwroot/mobile.js", "Phoenix.Web/wwwroot/index.html", "Phoenix.Web/wwwroot/login*", ".github/workflows/build-android.yml", "Phoenix.Web/wwwroot/icons/phoenix-maskable-512.png"]
  pull_request:
    paths: ["android/**", "Phoenix.Web/wwwroot/personal*", "Phoenix.Web/wwwroot/mobile.js", "Phoenix.Web/wwwroot/index.html", "Phoenix.Web/wwwroot/login*", ".github/workflows/build-android.yml", "Phoenix.Web/wwwroot/icons/phoenix-maskable-512.png"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: orbit-debug-key-v1
      - name: Add launcher logo
        run: |
          mkdir -p android/app/src/main/res/drawable
          cp Phoenix.Web/wwwroot/icons/phoenix-maskable-512.png android/app/src/main/res/drawable/phoenix_logo.png
      - name: Build test APK
        working-directory: android
        env:
          PHOENIX_FIREBASE_APP_ID: ${{ vars.PHOENIX_FIREBASE_APP_ID }}
          PHOENIX_FIREBASE_API_KEY: ${{ vars.PHOENIX_FIREBASE_API_KEY }}
          PHOENIX_FIREBASE_PROJECT_ID: ${{ vars.PHOENIX_FIREBASE_PROJECT_ID }}
          PHOENIX_FIREBASE_SENDER_ID: ${{ vars.PHOENIX_FIREBASE_SENDER_ID }}
        run: gradle :app:testDebugUnitTest :app:assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: phoenix-android-test-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish installable integrated client
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/personal/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="personal-android-${GITHUB_SHA:0:8}"
          cp android/app/build/outputs/apk/debug/app-debug.apk orbit-android.apk
          gh release create "$tag" orbit-android.apk --target "$GITHUB_SHA" --prerelease --title "Orbit Android ${GITHUB_SHA:0:8}" --notes-file docs/android-install-preview.md
