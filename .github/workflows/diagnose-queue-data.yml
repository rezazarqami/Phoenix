name: Diagnose Phoenix Queue Data
on:
  push:
    branches: [codex/diagnose-queue-data]
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Inspect application JSON integrity without exposing records
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: 91.216.104.210
          username: phoenix-deploy
          key: ${{ secrets.PHOENIX_DEPLOY_SSH_KEY }}
          command_timeout: 1m
          script: |
            python3 - <<'PY'
            import pathlib,json,subprocess,os,re
            roots={pathlib.Path('/opt/Phoenix')}
            for prop in ['WorkingDirectory','ExecStart']:
                r=subprocess.run(['systemctl','show','phoenix.service','-p',prop,'--value'],capture_output=True,text=True,timeout=5)
                if prop=='WorkingDirectory' and r.stdout.strip().startswith('/'): roots.add(pathlib.Path(r.stdout.strip()))
                if prop=='ExecStart':
                    for p in re.findall(r'(/[A-Za-z0-9_./-]+\.dll)',r.stdout): roots.add(pathlib.Path(p).parent)
            for root in sorted(roots):
                print('APP_ROOT',str(root))
                for directory,dirs,files in os.walk(root):
                    dirs[:]=[d for d in dirs if d not in {'.git','node_modules','obj'}]
                    if len(pathlib.Path(directory).relative_to(root).parts)>5:dirs[:]=[];continue
                    for name in files:
                        if not (name.endswith('.json') and ('signal' in name.lower() or 'queue' in name.lower())):continue
                        path=pathlib.Path(directory)/name
                        try:
                            if path.stat().st_size>32*1024*1024: print('QUEUE',str(path),'SKIPPED_LARGE');continue
                            raw=path.read_bytes()
                            try:parsed=json.loads(raw);status='VALID_JSON'
                            except (ValueError,UnicodeError):status='INVALID_JSON'
                            print('QUEUE',str(path),'BYTES',len(raw),'NUL_BYTES',raw.count(bytes([0])),'STATUS',status)
                        except PermissionError:print('QUEUE_READ_DENIED',str(path))
            PY
