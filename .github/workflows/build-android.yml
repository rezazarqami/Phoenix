name: Build Phoenix Android

on:
  push:
    paths: ["android/**", "Phoenix.Web/wwwroot/personal*", "Phoenix.Web/wwwroot/orbit-simple.js", "docs/android-install-preview.md", "Phoenix.Web/wwwroot/mobile.js", "Phoenix.Web/wwwroot/index.html", "Phoenix.Web/wwwroot/login*", ".github/workflows/build-android.yml", "Phoenix.Web/wwwroot/icons/phoenix-maskable-512.png"]
  pull_request:
    paths: ["android/**", "Phoenix.Web/wwwroot/personal*", "Phoenix.Web/wwwroot/orbit-simple.js", "docs/android-install-preview.md", "Phoenix.Web/wwwroot/mobile.js", "Phoenix.Web/wwwroot/index.html", "Phoenix.Web/wwwroot/login*", ".github/workflows/build-android.yml", "Phoenix.Web/wwwroot/icons/phoenix-maskable-512.png"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: orbit-debug-key-v2
      - name: Ensure persistent test signing key
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey -keypass android -dname "CN=Android Debug,O=Android,C=US" -keyalg RSA -keysize 2048 -validity 10000
          fi
      - name: Add launcher logo
        run: |
          mkdir -p android/app/src/main/res/drawable
          cp Phoenix.Web/wwwroot/icons/phoenix-maskable-512.png android/app/src/main/res/drawable/phoenix_logo.png
      - name: Build test APK
        working-directory: android
        env:
          PHOENIX_FIREBASE_APP_ID: ${{ vars.PHOENIX_FIREBASE_APP_ID }}
          PHOENIX_FIREBASE_API_KEY: ${{ vars.PHOENIX_FIREBASE_API_KEY }}
          PHOENIX_FIREBASE_PROJECT_ID: ${{ vars.PHOENIX_FIREBASE_PROJECT_ID }}
          PHOENIX_FIREBASE_SENDER_ID: ${{ vars.PHOENIX_FIREBASE_SENDER_ID }}
        run: gradle :app:testOrbitDebugUnitTest :app:testPhoenixDebugUnitTest :app:assembleOrbitDebug :app:assemblePhoenixDebug --no-daemon
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Exercise startup in a real Android WebView
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: google_apis
          disable-animations: true
          script: cd android && gradle :app:connectedOrbitDebugAndroidTest :app:connectedPhoenixDebugAndroidTest --no-daemon
      - name: Save Android test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: orbit-android-test-reports
          path: |
            android/app/build/reports/androidTests
            android/app/build/reports/tests
            android/app/build/outputs/androidTest-results
      - uses: actions/upload-artifact@v4
        with:
          name: phoenix-android-test-apk
          path: android/app/build/outputs/apk/*/debug/*.apk
      - name: Publish installable integrated client
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/personal/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="personal-android-${GITHUB_SHA:0:8}"
          cp android/app/build/outputs/apk/orbit/debug/app-orbit-debug.apk orbit-android.apk
          cp android/app/build/outputs/apk/phoenix/debug/app-phoenix-debug.apk phoenix-android.apk
          gh release create "$tag" orbit-android.apk phoenix-android.apk --target "$GITHUB_SHA" --prerelease --title "Phoenix and Orbit Android ${GITHUB_SHA:0:8}" --notes-file docs/android-install-preview.md
