name: Verify Phoenix

on:
  pull_request:
    branches: [master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build and run similarity regression
        run: dotnet run --project Phoenix.Test/Phoenix.Test.csproj --configuration Release -- --filter "Target and stop similarity"
      - name: Validate Elliott hierarchy and PDF rules
        run: dotnet run --project Phoenix.Test/Phoenix.Test.csproj --configuration Release --no-build -- --filter Elliott
      - name: Validate chart rendering
        run: dotnet run --project Phoenix.Test/Phoenix.Test.csproj --configuration Release --no-build -- --filter "Signal Lab candidate"
      - name: Run cryptocurrency statistics regression
        run: dotnet run --project Phoenix.Test/Phoenix.Test.csproj --configuration Release --no-build -- --filter "Crypto statistics"
      - name: Verify signal responsiveness and active cancellation
        run: dotnet run --project Phoenix.Test/Phoenix.Test.csproj --configuration Release --no-build -- --filter Responsiveness
      - name: Verify cancellation authorization and state transitions
        run: dotnet run --project Phoenix.Test/Phoenix.Test.csproj --configuration Release --no-build -- --filter Cancellation
      - name: Verify persistent login and shared analysis session
        run: |
          dotnet run --project Phoenix.Test/Phoenix.Test.csproj --configuration Release --no-build -- --filter "Persistent session"
          dotnet run --project Phoenix.Test/Phoenix.Test.csproj --configuration Release --no-build -- --filter "Analysis accepts"
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Android-compatible cancellation controls
        run: node Phoenix.Test/cancellation-ui-tests.cjs
      - name: Verify batch controls under delayed responses
        run: node Phoenix.Test/batch-controls-tests.cjs
      - name: Verify complete Crypto Markets page initialization
        run: node Phoenix.Test/crypto-market-ui-tests.cjs
