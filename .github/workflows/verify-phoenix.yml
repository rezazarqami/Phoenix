name: Verify Phoenix

on:
  pull_request:
    branches: [master]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build and run complete Phoenix regression suite
        run: dotnet run --project Phoenix.Test/Phoenix.Test.csproj --configuration Release
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify Android-compatible cancellation controls
        run: node Phoenix.Test/cancellation-ui-tests.cjs
      - name: Verify batch controls under delayed responses
        run: node Phoenix.Test/batch-controls-tests.cjs
      - name: Verify complete Crypto Markets page initialization
        run: node Phoenix.Test/crypto-market-ui-tests.cjs
