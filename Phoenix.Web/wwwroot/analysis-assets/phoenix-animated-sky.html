<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PHOENIX continuous image animation</title><style>*{box-sizing:border-box}html,body{margin:0;background:#06152c}html,body{height:100%;overflow:hidden}.scene{width:100%;height:100%;overflow:hidden;position:relative;background:#06152c}canvas{display:block;position:absolute;max-width:none;animation:pan 10s linear infinite;animation-play-state:paused;will-change:transform}@keyframes pan{to{transform:translate3d(calc(-1 * var(--tile-shift)),0,0)}}@media(prefers-reduced-motion:reduce){canvas{animation:none;will-change:auto}}.scene:after{content:'';position:absolute;inset:0;pointer-events:none;background:linear-gradient(180deg,#06152c18 0%,#06152c08 65%,#020d2300 100%)}</style></head><body><div class="scene"><canvas id="c" width="1672" height="941"></canvas></div><script>
const img=new Image();img.src="/analysis-assets/phoenix-hero-artwork.jpg?v=1";// Rasterize the supplied artwork once; the compositor moves the finished layer.
const c=document.getElementById('c'),g=c.getContext('2d',{alpha:false});const PW=1172,VW=1672,VH=941;
let visible=true;const reduced=matchMedia('(prefers-reduced-motion: reduce)');
function paint(){
 const scale=Math.max(innerWidth/VW,innerHeight/VH),width=(VW+PW)*scale,height=VH*scale;
 const ratio=Math.min(devicePixelRatio||1,1.25,2600/width);
 c.width=Math.ceil(width*ratio);c.height=Math.ceil(height*ratio);
 c.style.width=width+'px';c.style.height=height+'px';c.style.left=(innerWidth-VW*scale)/2+'px';c.style.top=(innerHeight-height)/2+'px';
 c.style.setProperty('--tile-shift',PW*scale+'px');
 g.setTransform(c.width/(VW+PW),0,0,c.height/VH,0,0);
 for(let x=0;x<VW+PW;x+=PW)g.drawImage(img,x,0);
}
function sync(){c.style.animationPlayState=visible&&!document.hidden&&!reduced.matches?'running':'paused';}
addEventListener('message',event=>{if(event.source===parent&&event.data?.type==='phoenix-hero-visibility'){visible=event.data.visible===true;sync();}});
document.addEventListener('visibilitychange',sync);reduced.addEventListener?.('change',sync);
addEventListener('resize',()=>{if(img.complete&&img.naturalWidth)paint();});
img.onload=()=>{paint();sync();};
</script></body></html>
