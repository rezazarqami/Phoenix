<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101d2c"><link rel="manifest" href="/manifest.webmanifest"><link rel="icon" href="/icons/phoenix-192.png"><link rel="stylesheet" href="/personal.css?v=1"><title>فضای شخصی رضا</title></head><body>
<header><a class="wordmark" href="/">R<span>•</span> / PERSONAL</a><div><a class="quiet" href="/phoenix">فونیکس ↗</a><button id="logout" class="quiet">خروج</button></div></header>
<main><section class="welcome"><div><span class="eyebrow">MY LIFE, IN FOCUS</span><h1>فضای شخصی من</h1><p>روزها را ثبت کن، مسیرت را بهتر بشناس.</p></div><time id="today"></time></section>
<a href="/phoenix" class="phoenix-card"><div><span class="eyebrow">TRADING WORKSPACE</span><h2>فونیکس</h2><p>سیگنال‌ها، معاملات و تحلیل بازار</p></div><span class="arrow">↗</span></a>
<nav aria-label="بخش‌های فضای شخصی"><button data-tab="overview" aria-pressed="true">نمای کلی</button><button data-tab="finance" aria-pressed="false">حساب‌وکتاب</button><button data-tab="vehicle" aria-pressed="false">خودرو</button><button data-tab="journal" aria-pressed="false">روزمره</button></nav>
<p id="status" role="status" aria-live="polite"></p>
<section id="overview"><div class="section-heading"><h2>مرور داده‌ها</h2><label>بازه <select id="range"><option value="month">ماه جاری</option><option value="all">همهٔ زمان‌ها</option></select></label></div><div id="metrics" class="metrics"></div><section class="card"><h3>هزینه‌ها به تفکیک دسته</h3><div id="categories"></div></section><div class="section-heading"><h2>آخرین ثبت‌ها</h2><button id="export" class="quiet">دریافت داده‌ها (JSON)</button></div><div id="recent"></div></section>
<section id="records" hidden><div class="section-heading"><h2 id="sectionTitle"></h2><span>ذخیره در فضای شخصی شما</span></div><form id="entryForm" class="card"><div class="form-grid"><label>عنوان<input name="title" required maxlength="200" placeholder="مثلاً خرید روزانه یا تعویض روغن"></label><label>تاریخ<input name="date" type="date" required></label><label>دسته‌بندی<input name="category" maxlength="100" placeholder="مثلاً خوراک، سرویس، رشد فردی"></label><label class="money-field">مبلغ (تومان)<input name="amount" type="number" min="0" max="1000000000000000" step="1" inputmode="numeric"></label><label class="finance-field">نوع تراکنش<select name="flow"><option value="expense">هزینه</option><option value="income">درآمد</option></select></label><label class="vehicle-field" hidden>خودرو<input name="vehicle" maxlength="100" placeholder="مدل یا نام خودرو"></label><label class="vehicle-field" hidden>کیلومتر خودرو<input name="odometer" type="number" min="0" max="2147483647" step="1" inputmode="numeric"></label><label class="wide">شرح و جزئیات<textarea name="notes" rows="4" maxlength="10000" placeholder="چه اتفاقی افتاد؟ چه چیزی یاد گرفتی؟"></textarea></label></div><button class="primary" type="submit">ثبت اطلاعات ＋</button></form><div class="section-heading"><h3>سوابق ثبت‌شده</h3><input id="search" type="search" placeholder="جست‌وجو در سوابق" aria-label="جست‌وجو در سوابق"></div><div id="list"></div></section>
<footer>فضای شخصی • یک ورود برای زندگی روزمره و فونیکس</footer></main><script src="/personal.js?v=1"></script><script src="/install-phoenix.js?v=2"></script></body></html>
