const c=document.getElementById('c'),g=c.getContext('2d',{alpha:false});const PW=1172,VW=1672,VH=941;
let visible=true;const reduced=matchMedia('(prefers-reduced-motion: reduce)');
function paint(){
 const scale=Math.max(innerWidth/VW,innerHeight/VH),width=(VW+PW)*scale,height=VH*scale;
 const ratio=Math.min(devicePixelRatio||1,1.25,2600/width);
 c.width=Math.ceil(width*ratio);c.height=Math.ceil(height*ratio);
 c.style.width=width+'px';c.style.height=height+'px';c.style.left=(innerWidth-VW*scale)/2+'px';c.style.top=(innerHeight-height)/2+'px';

 for(let x=0;x<VW+PW;x+=PW)g.drawImage(img,x,0);
}
function sync(){c.style.animationPlayState=visible&&!document.hidden&&!reduced.matches?'running':'paused';}
addEventListener('message',event=>{if(event.source===parent&&event.data?.type==='phoenix-hero-visibility'){visible=event.data.visible===true;sync();}});
document.addEventListener('visibilitychange',sync);reduced.addEventListener?.('change',sync);
addEventListener('resize',()=>{if(img.complete&&img.naturalWidth)paint();});
img.onload=()=>{paint();sync();};
